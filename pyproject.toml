[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "nova-assistant"
version = "0.2.0"
description = "NOVA — Neural Operations & Virtual Assistant"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
voice = [
  "sounddevice>=0.5.1",
  "vosk>=0.3.44",
]
dev = ["pytest>=8.0"]
desktop = ["rumps>=0.4.0"]

[project.scripts]
nova = "nova.main:main"
nova-menubar = "nova.menubar:main"

[tool.setuptools.packages.find]
include = ["nova*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
